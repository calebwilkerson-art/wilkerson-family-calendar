name: Keep schedules alive

# GitHub switches scheduled workflows off after 60 days without repository
# activity. One commit a month keeps the reminders running.
on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d" > .github/last-active
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active
          git commit -m "Keep scheduled reminders alive" || exit 0
          git push
